  <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COHÉLISENS — En évolution</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #1a3a5c; /* Votre bleu pétrole profond */
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 40px 20px; 
            text-align: center; 
        }
        .container { 
            max-width: 600px; 
            width: 100%;
        }
        .logo {
            width: 160px;
            height: auto;
            margin-bottom: 25px;
        }
        h1 { 
            font-size: 2.2rem; 
            color: #ffffff; /* Écrit en blanc comme demandé */
            margin-bottom: 25px; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 5px;
        }
        p { 
            font-size: 1.1rem; 
            line-height: 1.7; 
            color: #ffffff; 
            margin-bottom: 20px; 
            font-weight: 300;
        }
        .highlight { 
            font-size: 1.3rem;
            font-weight: 400; 
            color: #E8A830; /* Votre Or Cohelisens */
            margin-bottom: 25px;
            font-style: italic;
        }
        .form-section { 
            margin-top: 40px; 
            border-top: 1px solid rgba(255, 255, 255, 0.2); 
            padding-top: 30px; 
            text-align: left;
        }
        .form-title {
            font-size: 1rem;
            color: #E8A830;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-align: center;
        }
        /* Style de votre formulaire d'origine */
        .contact-form { 
            width: 100%;
            background: rgba(255, 255, 255, 0.05); 
            padding: 30px; 
            border-radius: 15px; 
            border: 1px solid rgba(232, 168, 48, 0.2);
        }
        .contact-form input, .contact-form textarea { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 5px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            background: rgba(255, 255, 255, 0.9);
            color: #1a3a5c;
            font-size: 0.95rem; 
            box-sizing: border-box; 
            font-family: 'Montserrat', sans-serif; 
        }
        .contact-form input::placeholder, .contact-form textarea::placeholder {
            color: #777;
        }
        .btn-or { 
            width: 100%;
            background: #E8A830; 
            color: #1a3a5c; 
            padding: 15px; 
            border-radius: 5px; 
            text-decoration: none; 
            font-weight: 700; 
            border: none; 
            cursor: pointer; 
            font-size: 1rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s; 
        }
        .btn-or:hover { 
            transform: scale(1.02); 
        }
        .linkedin-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #ffffff;
            font-size: 0.9rem;
            text-decoration: underline;
            opacity: 0.8;
            font-weight: 300;
        }
        .linkedin-link:hover {
            opacity: 1;
            color: #E8A830;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Votre Logo -->
        <img src="image_a0038e.png" alt="Logo COHÉLISENS" class="logo">
        
        <h1>COHÉLISENS</h1>
        
        <p class="highlight">Pause inspirante.</p>
        
        <p>Nous prenons un moment pour l'évolution notre activité.</p>
        
        <p>Merci pour votre confiance et votre patience. On se retrouve très vite !</p>
        
        <!-- Section Formulaire Formspree -->
        <div class="form-section">
            <h2 class="form-title">📩 Restons en contact</h2>
            
            <form action="https://formspree.io/f/xaqllyyb" method="POST" class="contact-form">
                <input type="hidden" name="_next" value="https://mikatebysoni-jpg.github.io/COHELISENS-SITE/merci.html">
                <input type="text" name="nom_entreprise" placeholder="Votre nom et entreprise" required>
                <input type="email" name="email" placeholder="Votre email professionnel" required>
                <input type="tel" name="telephone" placeholder="Votre numéro de téléphone" required>
                <textarea name="message" placeholder="Votre message..." rows="4" required></textarea>
                <button type="submit" class="btn-or">Envoyer ma demande</button>
            </form>
            
            <!-- Votre lien LinkedIn secondaire en discret dessous -->
            <a href="https://www.linkedin.com/in/soni-ngufulu-aa91b5400" target="_blank" class="linkedin-link">
                Nous suivre sur LinkedIn 🤝
            </a>
        </div>
    </div>

</body>
</html>
